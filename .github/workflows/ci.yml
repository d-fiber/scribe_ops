name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK: 3.12.2
  DENO_VERSION: 2.7.14

jobs:
  # The three checks every repository owes, held once in the framework.
  checks:
    uses: d-fiber/scribe/.github/workflows/gate.yml@7cd6af853c86cdd9d06470d82eea9db049b65516
    with:
      excluded: "node_modules .git .dart_tool __pycache__ fixtures .rendered .e2e"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: scribe_ops

      - name: Check out the framework the stack mounts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe

      - name: Check out the CLI that renders the templates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: d-fiber/scribe_tools
          ref: dev
          path: scribe_tools

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('scribe_tools/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Render every fixture and read what comes out
        working-directory: scribe_ops
        run: bash verify/tool/verify.sh


  tag:
    needs: [verify, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Name this commit if the version moved
        run: bash .github/version/tag.sh
