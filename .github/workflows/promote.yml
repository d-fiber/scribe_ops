name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version you are putting on main, as three numbers.
        required: true

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: promotion
    steps:
      - name: Check who asked
        env:
          ASKED_BY: ${{ github.actor }}
          OWNER: ${{ vars.PROMOTER || 'daf-ep' }}
        run: |
          set -eu
          if [ "$ASKED_BY" != "$OWNER" ]; then
            echo "$ASKED_BY asked to promote, and only $OWNER decides that. Nothing was moved." >&2
            exit 1
          fi
          echo "asked by $ASKED_BY"

      - name: Check that the key this needs is here
        env:
          KEY: ${{ secrets.PROMOTE_PUSH_KEY }}
        run: |
          set -eu
          [ -n "$KEY" ] && exit 0

          echo "PROMOTE_PUSH_KEY is not set on this repository, and nothing can move without it." >&2
          echo "" >&2
          echo "It is the private half of the deploy key named \"ops promote\", which the ruleset" >&2
          echo "lets through to main. Without it the push is refused like anybody else's, and a" >&2
          echo "push made with GITHUB_TOKEN starts no workflow, so the sync would never run." >&2
          echo "" >&2
          echo "Nothing was moved." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_PUSH_KEY }}

      - name: Check that this version has not already been written
        env:
          ASKED: ${{ inputs.version }}
        run: |
          set -eu
          case "$ASKED" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "\"$ASKED\" is not a version. Write three numbers, as in 1.0.2. Nothing was moved." >&2; exit 1 ;;
          esac

          if ! git rev-parse "v$ASKED" >/dev/null 2>&1; then
            echo "v$ASKED does not exist, so the CI has never been green on that version." >&2
            echo "The tag is written by the tag job on dev, from the first numbered section of" >&2
            echo "CHANGELOG.md. Nothing was moved." >&2
            exit 1
          fi

          grep -q "^## $ASKED\$" CHANGELOG.md ||
            { echo "CHANGELOG.md has no \"## $ASKED\" section, so nobody could read what moved." >&2; exit 1; }

      - name: Check that dev carries something main does not
        run: |
          set -eu
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "main does not exist yet, so this promotion is what creates it"
            exit 0
          fi

          if [ -z "$(git log origin/main..origin/dev --oneline)" ]; then
            echo "dev carries nothing main does not. Nothing was moved." >&2
            exit 1
          fi

      - name: Put dev on main
        env:
          ASKED: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            git checkout main
            git merge origin/dev -m "Merge dev into main for $ASKED"
          else
            git checkout -b main
          fi

          git push origin main

      - name: Point dev back at main
        run: |
          set -eu
          if git push origin HEAD:dev; then
            exit 0
          fi

          echo "main now holds the version, but dev could not be moved onto it." >&2
          echo "" >&2
          echo "Something reached dev while this promotion was running, so dev is no longer" >&2
          echo "an ancestor of what main holds. Nothing is lost: settle dev, then push it." >&2
          exit 1

      - name: Write the release
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          set -eu
          awk -v version="$ASKED" '
            $0 == "## " version { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md

          gh release create "v$ASKED" --title "$ASKED" --notes-file /tmp/notes.md --verify-tag
