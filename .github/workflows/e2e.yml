name: e2e

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK: 3.12.2
  DENO_VERSION: 2.7.14

jobs:
  e2e-light:
    strategy:
      fail-fast: false
      matrix:
        scenario: [00_datastores, 02_gateway, 12_two_projects]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: scribe_ops

      - name: Check out the framework the stack mounts
        uses: actions/checkout@v4
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe

      - name: Check out the CLI that renders the templates
        uses: actions/checkout@v4
        with:
          repository: d-fiber/scribe_tools
          ref: dev
          path: scribe_tools

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('scribe_tools/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Run ${{ matrix.scenario }} against a real daemon
        working-directory: scribe_ops
        run: bash "e2e_tests/${{ matrix.scenario }}/scenario.sh"

  e2e-heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: cluster
            scenarios: 01_database 05_restart 06_target 09_limits
          - group: stack
            scenarios: 03_stack 04_request 07_worker 10_hardening
          - group: packages
            scenarios: 08_two_stacks 11_every_package
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Take back the disk the runner spends on toolchains nothing here uses
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          path: scribe_ops

      - name: Check out the framework the stack mounts
        uses: actions/checkout@v4
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe

      - name: Check out the CLI that renders the templates
        uses: actions/checkout@v4
        with:
          repository: d-fiber/scribe_tools
          ref: dev
          path: scribe_tools

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('scribe_tools/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Run the ${{ matrix.group }} scenarios, one after another on this daemon
        working-directory: scribe_ops
        env:
          GROUP: ${{ matrix.group }}
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          set -u
          failed=""

          for scenario in $SCENARIOS; do
            echo "::group::$scenario"
            bash "e2e_tests/$scenario/scenario.sh" || failed="$failed $scenario"
            echo "::endgroup::"

            docker system prune --force --volumes >/dev/null
            df -h / | tail -1
          done

          if [ -n "$failed" ]; then
            echo "" >&2
            echo "These scenarios of the $GROUP set did not pass:$failed" >&2
            echo "" >&2
            echo "Each one printed the state of its services and the tail of their logs where it" >&2
            echo "stopped, under its own group above. Nothing is left running: a scenario tears" >&2
            echo "its own stack down on the way out, whether it passed or not." >&2
            exit 1
          fi

          echo "the $GROUP set is green"
