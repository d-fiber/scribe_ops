name: "scribe_router"

services:
  router:
    image: "traefik:v3.6.2"
    restart: "unless-stopped"
    command:
      [
        "--providers.docker=true",
        "--providers.docker.endpoint=tcp://socket-proxy:2375",
        "--providers.docker.exposedByDefault=false",
        "--entrypoints.web.address=:80",
        "--entrypoints.websecure.address=:443",
        "--entrypoints.websecure.http.tls=true",
        "--certificatesresolvers.public.acme.email=${SCRIBE_ACME_EMAIL:-}",
        "--certificatesresolvers.public.acme.storage=/acme/acme.json",
        "--certificatesresolvers.public.acme.httpchallenge=true",
        "--certificatesresolvers.public.acme.httpchallenge.entrypoint=web",
        "--ping=true",
        "--log.level=WARN",
        "--accesslog=true",
      ]
    ports:
      - "80:80"
      - "443:443"
    networks: ["socket"]
    volumes:
      - "acme:/acme"
    depends_on:
      socket-proxy:
        condition: "service_started"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  socket-proxy:
    image: "tecnativa/docker-socket-proxy:v0.5.0"
    restart: "unless-stopped"
    networks: ["socket"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      VERSION: "1"
      POST: "0"
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  acme: null

networks:
  socket:
    internal: true
