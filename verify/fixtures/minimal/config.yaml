name: fixture
description: The project the suite renders, which exists to be rendered and nothing else.
version: 1.0.0

environment:
  scribe: "^1.0.0"

dependencies:

dashboard: ""

targets:
  local:
    kind: dev
    machine: host
  vps:
    kind: machine
    machine:
      cores: 4
      threads: 8
      memory: 4g
    cpu_cap: true
  big:
    kind: machine
    machine:
      cores: 16
      threads: 32
      memory: 64g

api:
  url: "https://fixture.example.com"
  cors:
    - "https://fixture.example.com"
  nodes:
    example:
      description: "A node taking every default."
    guarded:
      description: "A node asking for a key, so key-auth and acl are rendered."
      api_key: true
      rate_limit:
        sec: 5
        min: 60
      max_body_mb: 2
      timeout_sec: 10
    internal:
      description: "A node facing inward, which the gateway must not route."
      public: false
