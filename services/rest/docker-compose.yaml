name: "{{app_name_snake}}"

services:
  rest:
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["data"]
    build:
      context: "{{service_rest}}"
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    environment:
      PGRST_DB_URI: "postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: "public"
      PGRST_DB_ANON_ROLE: "anon"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: "5"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_ADMIN_SERVER_PORT: "3001"
    command: ["postgrest"]
    stop_grace_period: "30s"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3001; printf \"GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"' 2>/dev/null",
        ]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "40s"
    depends_on:
      db:
        condition: "service_healthy"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
