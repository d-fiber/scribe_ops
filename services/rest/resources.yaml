name: "{{app_name_snake}}"

services:
  rest:
    cpu_shares: {{rest_cpu_shares}}
    memswap_limit: "{{rest_mem_limit}}"
    deploy:
      resources:
        limits:
          memory: "{{rest_mem_limit}}"{{rest_cpu_ceiling}}
          pids: 512
        reservations:
          memory: "{{rest_mem_res}}"
