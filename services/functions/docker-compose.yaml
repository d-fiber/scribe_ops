name: "{{app_name_snake}}"

services:
  functions:
    networks: ["app", "data"]
    profiles: ["functions"]
    build:
      context: "{{build_context_functions}}"
      dockerfile: "{{dockerfile_functions}}"
      {{build_platform}}
    image: "{{image_functions}}"
    restart: "unless-stopped"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
{{source_mounts_functions}}      - "deno-cache:/deno-dir"
    environment:
      APP_NAME: "{{app_name}}"
    env_file:
      - path: "{{stack_env}}/host.env"
        required: true
      - path: "{{stack_env}}/datastores.env"
        required: true
    command:
      - "start"
      - "--main-service"
      - "/home/deno/functions/shell/platform/edge"
      - "--import-map"
      - "/home/deno/{{alchemy_dir}}/sdk/js/scribe.container.json"
    depends_on:
      db:
        condition: "service_healthy"
      kong:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
      db-migrate:
        condition: "service_completed_successfully"
      nats:
        condition: "service_healthy"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /_health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"' 2>/dev/null",
        ]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "30s"
    stop_grace_period: "30s"
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
