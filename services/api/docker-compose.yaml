name: "{{app_name_snake}}"

services:
  api:
    read_only: true
    tmpfs: ["/tmp"]
    networks: ["app", "data"]
    build:
      context: "{{build_context_api}}"
      dockerfile: "{{dockerfile_api}}"
      {{build_platform}}
    image: "{{image_api}}"
    restart: "unless-stopped"
    user: "{{user_api}}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
{{volumes_api}}
    environment:
      PORT: "3000"
      APP_NAME: "{{app_name}}"
      API_MAX_INFLIGHT_BODY_MB: "{{api_max_inflight_body}}"
      WORKER_ENDPOINT: "{{worker_endpoint}}"
      WORKER_CALLBACK_PORT: "4747"
    env_file:
      - path: "{{stack_env}}/host.env"
        required: true
      - path: "{{stack_env}}/datastores.env"
        required: true
      - path: "{{stack_env}}/packages.env"
        required: true
      - path: "{{stack_env}}/project.env"
        required: false
    command:
{{runtime_command_api}}
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
      nats:
        condition: "service_healthy"
      db-migrate:
        condition: "service_completed_successfully"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_health || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "60s"
    stop_grace_period: "30s"
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
